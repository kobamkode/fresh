unbind C-b
set-option -g prefix M-a
bind-key M-a send-prefix

set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
set -g extended-keys on
set -g extended-keys-format csi-u
set-option -g renumber-windows on

# name opencode windows after their project dir; other windows keep the command name
set -g automatic-rename-format '#{?#{==:#{pane_current_command},opencode},#{b:pane_current_path},#{?pane_in_mode,[tmux],#{pane_current_command}}#{?pane_dead,[dead],}}'

# close pane/window without y/n confirmation
bind-key x kill-pane
bind-key & kill-window
